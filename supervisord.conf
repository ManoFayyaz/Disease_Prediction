[supervisord]
nodaemon=true

[program:flask]
command=python app.py
autostart=true
autorestart=true
# This ensures Flask sees its own output in the logs
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:streamlit]
# Streamlit will take the PUBLIC port provided by Railway
command=streamlit run skin_disease.py --server.port %(ENV_PORT)s --server.address 0.0.0.0 --server.headless true
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

